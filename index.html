<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lightling.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bring your battlemap to life with dynamic lighting, custom effects, and a player view for your TV table. Build atmospheric encounters in your browser."
    />
    <meta name="theme-color" content="#1c1917" />
    <link
      rel="preload"
      href="/src/assets/fonts/outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Dynamic Lighting for TV Table Battlemaps | Lighting VTT</title>
    <script>
      // Discover the landing LCP image before React, without downloading it on
      // scene/editor routes. Keep these candidates in sync with ProductShowcase.
      if (window.location.pathname === "/") {
        const showcase = document.createElement("link");
        showcase.rel = "preload";
        showcase.as = "image";
        showcase.href = "/landing/temple-player-1600.webp";
        showcase.imageSrcset = "/landing/temple-player-800.webp 800w, /landing/temple-player-1600.webp 1600w";
        showcase.imageSizes = "(max-width: 760px) calc(100vw - 32px), (max-width: 1280px) calc(100vw - 80px), 1200px";
        showcase.fetchPriority = "high";
        document.head.appendChild(showcase);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
