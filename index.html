<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lightling.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bring your battlemap to life with dynamic lighting, custom effects, and a dedicated player view for your TV table. Lighting VTT runs in your browser."
    />
    <meta name="theme-color" content="#1c1917" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Lighting VTT | Bring Your TV-Table Battlemap to Life</title>
    <script>
      // Discover the landing LCP image before React, without downloading it on
      // scene/editor routes. Keep these candidates in sync with ProductShowcase.
      if (window.location.pathname === "/") {
        const showcase = document.createElement("link");
        showcase.rel = "preload";
        showcase.as = "image";
        showcase.href = "/landing/temple-player-1600.webp";
        showcase.imageSrcset = "/landing/temple-player-800.webp 800w, /landing/temple-player-1600.webp 1600w";
        showcase.imageSizes = "(max-width: 760px) calc(100vw - 32px), (max-width: 1280px) calc(100vw - 80px), 1200px";
        showcase.fetchPriority = "high";
        document.head.appendChild(showcase);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
